<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>リバーシ</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23286b4c'/%3E%3Ccircle cx='24' cy='32' r='12' fill='%23101312'/%3E%3Ccircle cx='42' cy='32' r='12' fill='%23f2f0e8'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Reversi</p>
          <h1 id="app-title">リバーシ</h1>
        </div>
        <div class="scores" aria-label="現在のスコア">
          <div class="score score-black">
            <span>黒</span>
            <strong id="black-score">2</strong>
          </div>
          <div class="score score-white">
            <span>白</span>
            <strong id="white-score">2</strong>
          </div>
        </div>
      </header>

      <section class="game-layout">
        <div class="board-area">
          <div class="board-frame" aria-label="リバーシ盤">
            <div id="board" class="board" role="grid" aria-label="8かける8のリバーシ盤"></div>
          </div>
          <p id="status" class="status" aria-live="polite">黒の番です。</p>
        </div>

        <aside class="side-panel" aria-label="ゲーム操作">
          <section class="panel-section">
            <h2>対戦</h2>
            <div class="segmented" role="radiogroup" aria-label="対戦モード">
              <label>
                <input type="radio" name="mode" value="cpu" checked />
                <span>1人</span>
              </label>
              <label>
                <input type="radio" name="mode" value="two" />
                <span>2人</span>
              </label>
            </div>
          </section>

          <section class="panel-section" id="cpu-section">
            <h2>CPU</h2>
            <label class="select-label" for="difficulty">強さ</label>
            <select id="difficulty">
              <option value="easy">やさしい</option>
              <option value="normal" selected>ふつう</option>
              <option value="hard">つよめ</option>
              <option value="strongest">最強</option>
            </select>
          </section>

          <section class="panel-section">
            <h2>表示</h2>
            <label class="toggle">
              <input id="show-hints" type="checkbox" checked />
              <span>置ける場所を表示</span>
            </label>
          </section>

          <section class="panel-section actions">
            <button id="new-game" type="button">新しいゲーム</button>
            <button id="undo" type="button">元に戻す</button>
          </section>
        </aside>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
